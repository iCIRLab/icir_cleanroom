# Nav2 overrides for the mobile AMC. Values are adapted from
# cleanroom_gas_sim/config/nav2_amc.yaml (Apache-2.0, see docs/third_party/)
# into this project's partial-profile form, which merges onto
# config/nav2_params.yaml and additionally requires robot_motion.
robot_motion:
  # Matches <max_wheel_acceleration> and the amc_lidar update rate in
  # urdf/mobile_amc.sdf.
  max_wheel_acceleration: 0.6
  lidar_update_rate: 10.0

controller_server:
  ros__parameters:
    FollowPath:
      max_vel_x: 0.18
      max_vel_y: 0.0
      max_vel_theta: 0.7
      max_speed_xy: 0.18
      min_speed_xy: 0.0
      acc_lim_x: 0.6
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -0.6
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vtheta_samples: 30
      sim_time: 2.0

velocity_smoother:
  ros__parameters:
    max_velocity: [0.18, 0.0, 0.7]
    min_velocity: [-0.18, 0.0, -0.7]
    max_accel: [0.6, 0.0, 3.2]
    max_decel: [-0.6, 0.0, -3.2]

behavior_server:
  ros__parameters:
    rotational_acc_lim: 3.2

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      width: 4
      height: 4
      resolution: 0.05
      # The AMC is rectangular, so a footprint replaces the TurtleBot3
      # robot_radius; Nav2 ignores robot_radius once footprint is set.
      footprint: '[[0.48, 0.34], [0.48, -0.34], [-0.48, -0.34], [-0.48, 0.34]]'
      footprint_padding: 0.02
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      inflation_layer:
        inflation_radius: 0.5
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      resolution: 0.05
      footprint: '[[0.48, 0.34], [0.48, -0.34], [-0.48, -0.34], [-0.48, 0.34]]'
      footprint_padding: 0.02
      inflation_layer:
        inflation_radius: 0.5
        cost_scaling_factor: 3.0
