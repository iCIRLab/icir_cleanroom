robot_motion:
  max_wheel_acceleration: 24.0
  lidar_update_rate: 10.0

controller_server:
  ros__parameters:
    FollowPath:
      # DWB diagnostics for identifying why candidate trajectories are
      # accepted or rejected. These publishers do not change control output.
      publish_evaluation: true
      publish_trajectories: true
      publish_cost_grid_pc: true
      max_vel_x: 0.6
      max_speed_xy: 0.4
      max_vel_theta: 1.8
      acc_lim_x: 1.0
      decel_lim_x: -1.0
      acc_lim_theta: 2.0
      decel_lim_theta: -2.0
      vtheta_samples: 30
      sim_time: 1.7

velocity_smoother:
  ros__parameters:
    max_velocity: [0.4, 0.0, 1.8]
    min_velocity: [-0.4, 0.0, -1.8]
    max_accel: [0.8, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      width: 3
      height: 3
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      inflation_layer:
        inflation_radius: 0.30
        cost_scaling_factor: 5.0

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      inflation_layer:
        inflation_radius: 0.30
        cost_scaling_factor: 5.0
