robot_motion:
  max_wheel_acceleration: 152.0
  lidar_update_rate: 5.0

controller_server:
  ros__parameters:
    FollowPath:
      max_vel_x: 1.0
      max_speed_xy: 1.0
      acc_lim_x: 5.0
      decel_lim_x: -5.0

velocity_smoother:
